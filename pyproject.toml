[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-benchmark"
version = "0.1.0"
description = "Hardware-aware, task-aware benchmarking for local language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Local AI Benchmark contributors" }]
dependencies = ["cryptography>=45.0"]

[project.optional-dependencies]
system = ["psutil>=5.9"]
desktop = ["PySide6>=6.10,<7", "psutil>=5.9"]
llama = ["llama-cpp-python>=0.3.0"]
dev = ["pytest>=8"]
installer = ["pyinstaller>=6.12"]

[project.scripts]
local-ai = "local_ai_benchmark.cli:main"
aetherion-client = "local_ai_benchmark.client.qt.app:launch_desktop_app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
local_ai_benchmark = ["web/*", "client/qt/assets/*"]

[tool.vercel]
entrypoint = "index.html"
