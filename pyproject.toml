[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-benchmark"
version = "0.1.0"
description = "Hardware-aware, task-aware benchmarking for local language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Local AI Benchmark contributors" }]
dependencies = []

[project.optional-dependencies]
system = ["psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
local-ai = "local_ai_benchmark.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
local_ai_benchmark = ["web/*"]
